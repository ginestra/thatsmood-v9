<rect x="780" y="345" width="328" height="135" rx="20" fill="#FFF2E6" stroke="#B87942" stroke-width="2.5"/><circle cx="825" cy="389" r="13" fill="#B87942"/><path d="M804 432 Q804 409 825 409 Q846 409 846 432" fill="#B87942"/><text x="866" y="390" class="node">Small UX team</text><text x="866" y="415" class="small">Product design + research</text><text x="866" y="439" class="small">Limited capacity</text>
<rect x="77" y="551" width="1031" height="61" rx="12" fill="#F1F1EB"/><text x="100" y="578" class="note">The issue wasn’t individual requests. It was the lack of shared priorities and expectations.</text><text x="100" y="598" class="small">Time for research, exploration and evaluation was often overlooked.</text>
<text x="64" y="650" class="foot">Dashed lines: incoming demands · Solid lines: attempted triage · Conceptual relationships, not reporting lines</text></svg>