<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="02 ux as on demand service.svg"><rect width="1200" height="680" fill="#FAFAF7"/><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#242932}.eyebrow{font-size:14px;letter-spacing:2px;font-weight:700;fill:#657080}.head{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#596574}.small{font-size:14px;fill:#596574}.stage{font-size:16px;font-weight:700}.note{font-size:15px;font-weight:600}.node{font-size:16px;font-weight:700}.chip{font-size:13px;font-weight:600;fill:#596574}.foot{font-size:12px;fill:#75808b}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B87942"/></marker><marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C8C96"/></marker></defs>
<text x="64" y="64" class="eyebrow">THE INITIAL CHALLENGE / CONCEPTUAL VIEW</text><text x="64" y="109" class="head">Design became an on-demand service</text><text x="64" y="142" class="sub">Competing requests arrived before the purpose and priorities of UX were clearly understood.</text>
<rect x="76" y="190" width="300" height="73" rx="12" fill="#FFFFFF" stroke="#DEE3E3" stroke-width="2"/><text x="94" y="218" class="node">Marketing</text><text x="94" y="240" class="small">Exhibition material, copy</text><rect x="76" y="275" width="300" height="73" rx="12" fill="#FFFFFF" stroke="#DEE3E3" stroke-width="2"/><text x="94" y="303" class="node">Engineering</text><text x="94" y="325" class="small">Competing product requests</text><rect x="76" y="360" width="300" height="73" rx="12" fill="#FFFFFF" stroke="#DEE3E3" stroke-width="2"/><text x="94" y="388" class="node">Leadership</text><text x="94" y="410" class="small">Specific visual changes</text><rect x="76" y="445" width="300" height="73" rx="12" fill="#FFFFFF" stroke="#DEE3E3" stroke-width="2"/><text x="94" y="473" class="node">Internal initiatives</text><text x="94" y="495" class="small">Hackathon T-shirts, etc.</text><rect x="477" y="190" width="244" height="80" rx="15" fill="#E8EEF0" stroke="#9FADB3" stroke-width="2"/><text x="599" y="222" text-anchor="middle" class="node">Product Manager</text><text x="599" y="246" text-anchor="middle" class="small">Attempts to filter demand</text>
